<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-vf6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191919"/>
      <stop offset="100%" stop-color="#0C0C0C"/>
    </linearGradient>
    <linearGradient id="body-vf6" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#333333"/>
      <stop offset="50%" stop-color="#242424"/>
      <stop offset="100%" stop-color="#141414"/>
    </linearGradient>
    <filter id="glow-vf6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bg-vf6)"/>
  <ellipse cx="400" cy="405" rx="335" ry="22" fill="#000000" opacity="0.85"/>

  <!-- Sleek Italian Torino Contours & Flowing Coupe-SUV Roofline -->
  <path d="M 270 142 Q 400 135 530 148 L 600 230 L 190 230 Z" fill="#0D0D0D" stroke="#333333" stroke-width="2"/>
  <path d="M 280 148 Q 400 142 518 154 L 585 224 L 205 224 Z" fill="#0A0A0A"/>
  <path d="M 390 146 L 392 224" stroke="#262626" stroke-width="2"/>

  <!-- Elegant Athletic B-SUV Body -->
  <path d="M 155 230 L 645 230 L 670 330 L 635 372 L 165 372 L 130 330 Z" fill="url(#body-vf6)" stroke="#4A4A4A" stroke-width="1.5"/>

  <!-- Front Aerodynamic Air Curtains & Lightbar Housing -->
  <rect x="210" y="278" width="380" height="60" rx="14" fill="#0D0D0D" stroke="#2B2B2B" stroke-width="2"/>

  <!-- Flowing V-Wing LED -->
  <path d="M 225 296 Q 355 315 390 326" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" filter="url(#glow-vf6)"/>
  <path d="M 575 296 Q 445 315 410 326" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" filter="url(#glow-vf6)"/>

  <!-- VinFast Emblem -->
  <g transform="translate(388, 314) scale(0.24)">
    <path d="M 12 15 C 22 26, 32 46, 32 55 C 27 41, 18 25, 12 15 Z" fill="#FFFFFF"/>
    <path d="M 52 15 C 42 26, 32 46, 32 55 C 37 41, 46 25, 52 15 Z" fill="#FFFFFF"/>
    <path d="M 21 19 C 27 27, 30 38, 32 46 C 30 37, 26 27, 21 19 Z" fill="#E5E5E5"/>
    <path d="M 43 19 C 37 27, 34 38, 32 46 C 34 37, 38 27, 43 19 Z" fill="#E5E5E5"/>
  </g>

  <!-- Dual Wheels -->
  <circle cx="205" cy="380" r="46" fill="#0A0A0A" stroke="#262626" stroke-width="3"/>
  <circle cx="205" cy="380" r="32" fill="#1C1C1C" stroke="#525252" stroke-width="2"/>
  <circle cx="205" cy="380" r="14" fill="#737373"/>

  <circle cx="595" cy="380" r="46" fill="#0A0A0A" stroke="#262626" stroke-width="3"/>
  <circle cx="595" cy="380" r="32" fill="#1C1C1C" stroke="#525252" stroke-width="2"/>
  <circle cx="595" cy="380" r="14" fill="#737373"/>

  <!-- Typography -->
  <text x="40" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">VINFAST VF 6</text>
  <text x="40" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#737373" letter-spacing="2">B-SUV GIA ĐÌNH • THIẾT KẾ TORINO Ý</text>
  <rect x="40" y="102" width="130" height="26" rx="6" fill="#262626"/>
  <text x="50" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#E5E5E5">GIÁ TỪ 675 TRIỆU</text>
</svg>
