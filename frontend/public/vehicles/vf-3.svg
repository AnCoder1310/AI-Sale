<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-vf3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1A"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <linearGradient id="body-vf3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#404040"/>
      <stop offset="50%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#171717"/>
    </linearGradient>
    <linearGradient id="chrome-vf3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D4D4D4"/>
      <stop offset="100%" stop-color="#737373"/>
    </linearGradient>
    <filter id="glow-vf3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Studio Background -->
  <rect width="800" height="480" fill="url(#bg-vf3)"/>
  <circle cx="400" cy="240" r="220" fill="#262626" opacity="0.4" filter="blur(60px)"/>

  <!-- Ground Shadow -->
  <ellipse cx="400" cy="405" rx="320" ry="22" fill="#000000" opacity="0.85"/>

  <!-- VF 3 Boxy Body Shell -->
  <!-- Roof Top (White/Light Contrast) -->
  <path d="M 270 145 L 530 145 L 545 190 L 255 190 Z" fill="#E5E5E5" stroke="#FFFFFF" stroke-width="1.5"/>
  <rect x="260" y="185" width="280" height="8" fill="#171717"/>

  <!-- Glass Greenhouse (Windshield & Windows) -->
  <path d="M 268 193 L 532 193 L 565 260 L 235 260 Z" fill="#0A0A0A" stroke="#262626" stroke-width="2"/>
  <path d="M 390 193 L 392 260" stroke="#262626" stroke-width="3"/>
  <path d="M 285 205 L 375 205 L 365 245 L 265 245 Z" fill="#1F1F1F" opacity="0.6"/>
  <path d="M 405 205 L 515 205 L 535 245 L 405 245 Z" fill="#1F1F1F" opacity="0.6"/>

  <!-- Main Boxy Cabin & Shoulder -->
  <path d="M 215 260 L 585 260 L 610 330 L 600 370 L 200 370 L 190 330 Z" fill="url(#body-vf3)" stroke="#525252" stroke-width="1.5"/>

  <!-- Front Fascia Grille Area -->
  <rect x="250" y="295" width="300" height="65" rx="14" fill="#0F0F0F" stroke="#333333" stroke-width="2"/>

  <!-- Signature VinFast Illuminated V-Wing LED Lightbar -->
  <path d="M 265 315 Q 360 335 390 348" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" filter="url(#glow-vf3)"/>
  <path d="M 535 315 Q 440 335 410 348" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" filter="url(#glow-vf3)"/>

  <!-- Chrome Center Emblem -->
  <g transform="translate(388, 335) scale(0.24)">
    <path d="M 12 15 C 22 26, 32 46, 32 55 C 27 41, 18 25, 12 15 Z" fill="url(#chrome-vf3)"/>
    <path d="M 52 15 C 42 26, 32 46, 32 55 C 37 41, 46 25, 52 15 Z" fill="url(#chrome-vf3)"/>
    <path d="M 21 19 C 27 27, 30 38, 32 46 C 30 37, 26 27, 21 19 Z" fill="#FFFFFF"/>
    <path d="M 43 19 C 37 27, 34 38, 32 46 C 34 37, 38 27, 43 19 Z" fill="#FFFFFF"/>
  </g>

  <!-- High Clearance Rugged Wheel Arches & Wheels -->
  <!-- Left Wheel -->
  <circle cx="230" cy="380" r="48" fill="#0A0A0A" stroke="#262626" stroke-width="3"/>
  <circle cx="230" cy="380" r="34" fill="#171717" stroke="#404040" stroke-width="2"/>
  <circle cx="230" cy="380" r="14" fill="#525252"/>
  <!-- Right Wheel -->
  <circle cx="570" cy="380" r="48" fill="#0A0A0A" stroke="#262626" stroke-width="3"/>
  <circle cx="570" cy="380" r="34" fill="#171717" stroke="#404040" stroke-width="2"/>
  <circle cx="570" cy="380" r="14" fill="#525252"/>

  <!-- Rugged Front Skid Plate (Ground clearance 191mm) -->
  <path d="M 330 370 L 470 370 L 455 390 L 345 390 Z" fill="#2B2B2B" stroke="#525252" stroke-width="1.5"/>

  <!-- Badge & Typography Overlay -->
  <text x="40" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">VINFAST VF 3</text>
  <text x="40" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#737373" letter-spacing="2">MINI e-SUV • ĐÔ THỊ CÁ TÍNH</text>
  <rect x="40" y="102" width="130" height="26" rx="6" fill="#262626"/>
  <text x="50" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#E5E5E5">GIÁ TỪ 240 TRIỆU</text>
</svg>
