<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Circle for crisp contrast in both dark and light browser tabs -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0B1220" />
      <stop offset="100%" stopColor="#020617" />
    </linearGradient>

    <!-- Chrome Light Specular -->
    <linearGradient id="chrome-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="40%" stopColor="#E2E8F0" />
      <stop offset="75%" stopColor="#94A3B8" />
      <stop offset="100%" stopColor="#475569" />
    </linearGradient>

    <!-- Chrome Shadow / Bevel Ridge -->
    <linearGradient id="chrome-shadow" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stopColor="#CBD5E1" />
      <stop offset="50%" stopColor="#64748B" />
      <stop offset="85%" stopColor="#1E293B" />
      <stop offset="100%" stopColor="#0F172A" />
    </linearGradient>

    <!-- Inner Wings Reflection -->
    <linearGradient id="chrome-inner" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="45%" stopColor="#F1F5F9" />
      <stop offset="85%" stopColor="#64748B" />
      <stop offset="100%" stopColor="#334155" />
    </linearGradient>
  </defs>

  <!-- Circular background badge with sleek border -->
  <rect width="64" height="64" rx="16" fill="url(#bg-grad)" />
  <rect x="0.5" y="0.5" width="63" height="63" rx="15.5" stroke="#1E293B" stroke-width="1" />

  <!-- VinFast Outer Left Wing - Light Face -->
  <path
    d="M 12 15 C 22 26, 32 46, 32 55 C 27 41, 18 25, 12 15 Z"
    fill="url(#chrome-light)"
  />
  <!-- Outer Left Wing - Shadow Bevel Face -->
  <path
    d="M 12 15 C 24 28, 30 45, 32 55 C 31 43, 22 28, 16 19 Z"
    fill="url(#chrome-shadow)"
    opacity="0.85"
  />

  <!-- VinFast Outer Right Wing - Light Face -->
  <path
    d="M 52 15 C 42 26, 32 46, 32 55 C 37 41, 46 25, 52 15 Z"
    fill="url(#chrome-light)"
  />
  <!-- Outer Right Wing - Shadow Bevel Face -->
  <path
    d="M 52 15 C 40 28, 34 45, 32 55 C 33 43, 42 28, 48 19 Z"
    fill="url(#chrome-shadow)"
    opacity="0.85"
  />

  <!-- Inner Wing Left -->
  <path
    d="M 21 19 C 27 27, 30 38, 32 46 C 30 37, 26 27, 21 19 Z"
    fill="url(#chrome-inner)"
  />

  <!-- Inner Wing Right -->
  <path
    d="M 43 19 C 37 27, 34 38, 32 46 C 34 37, 38 27, 43 19 Z"
    fill="url(#chrome-inner)"
  />

  <!-- Center Specular Highlight Point -->
  <circle cx="32" cy="46" r="1" fill="#FFFFFF" opacity="0.9" />
</svg>
