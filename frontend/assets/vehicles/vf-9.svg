<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-vf9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="body-vf9" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2B2B2B"/>
      <stop offset="50%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </linearGradient>
    <filter id="glow-vf9" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="480" fill="url(#bg-vf9)"/>
  <ellipse cx="400" cy="412" rx="355" ry="24" fill="#000000" opacity="0.95"/>

  <!-- Majestic Full-size E-SUV Proportions with Integrated Hood Scoop / Air Pass-Through -->
  <path d="M 285 130 L 515 130 L 620 215 L 170 215 Z" fill="#0A0A0A" stroke="#333333" stroke-width="2"/>
  <path d="M 295 136 L 505 136 L 605 210 L 185 210 Z" fill="#141414"/>

  <!-- Extended 5.1-meter Commanding Body Shell -->
  <path d="M 120 215 L 680 215 L 710 325 L 660 378 L 140 378 L 90 325 Z" fill="url(#body-vf9)" stroke="#4A4A4A" stroke-width="2"/>

  <!-- Grand Executive Front Fascia -->
  <rect x="170" y="268" width="460" height="68" rx="16" fill="#080808" stroke="#2B2B2B" stroke-width="2"/>

  <!-- Grand VinFast V-Wing LED Lightbar -->
  <path d="M 188 288 Q 355 308 390 320" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" filter="url(#glow-vf9)"/>
  <path d="M 612 288 Q 445 308 410 320" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" filter="url(#glow-vf9)"/>

  <!-- VinFast Emblem -->
  <g transform="translate(388, 308) scale(0.24)">
    <path d="M 12 15 C 22 26, 32 46, 32 55 C 27 41, 18 25, 12 15 Z" fill="#FFFFFF"/>
    <path d="M 52 15 C 42 26, 32 46, 32 55 C 37 41, 46 25, 52 15 Z" fill="#FFFFFF"/>
    <path d="M 21 19 C 27 27, 30 38, 32 46 C 30 37, 26 27, 21 19 Z" fill="#E5E5E5"/>
    <path d="M 43 19 C 37 27, 34 38, 32 46 C 34 37, 38 27, 43 19 Z" fill="#E5E5E5"/>
  </g>

  <!-- Large 21-inch Executive Wheels & Air Suspension Clearance -->
  <circle cx="185" cy="384" r="52" fill="#0A0A0A" stroke="#262626" stroke-width="3"/>
  <circle cx="185" cy="384" r="38" fill="#141414" stroke="#525252" stroke-width="3"/>
  <circle cx="185" cy="384" r="15" fill="#8C8C8C"/>

  <circle cx="615" cy="384" r="52" fill="#0A0A0A" stroke="#262626" stroke-width="3"/>
  <circle cx="615" cy="384" r="38" fill="#141414" stroke="#525252" stroke-width="3"/>
  <circle cx="615" cy="384" r="15" fill="#8C8C8C"/>

  <!-- Typography -->
  <text x="40" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="1">VINFAST VF 9</text>
  <text x="40" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#737373" letter-spacing="2">E-SUV THƯƠNG GIA • GHẾ CƠ TRƯỞNG & TREO KHÍ NÉN</text>
  <rect x="40" y="102" width="145" height="26" rx="6" fill="#262626"/>
  <text x="50" y="119" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#E5E5E5">GIÁ TỪ 1,589 TỶ</text>
</svg>
