services:
  backend:
    build: .
    environment:
      APP_ENV: development
      PORT: 8000
      DATABASE_URL: sqlite:////app/data/db/app.db
      CHROMA_PERSIST_DIR: /app/data/chroma
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL_NAME: ${OPENROUTER_MODEL_NAME:-openai/gpt-6-luna}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openrouter}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-openai/text-embedding-3-small}
      AUTH_COOKIE_SECURE: "false"
      DEMO_ADVISOR_PASSWORD: ${DEMO_ADVISOR_PASSWORD:-}
      DEMO_MANAGER_PASSWORD: ${DEMO_MANAGER_PASSWORD:-}
    volumes:
      - sqlite_data:/app/data/db
      - chroma_data:/app/data/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
    environment:
      PORT: 3000
      BACKEND_UPSTREAM: backend:8000
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  sqlite_data:
  chroma_data:
